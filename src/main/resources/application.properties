# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-resource-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8085

# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=${JWT_SECRET:}
# =======================================================
# EUREKA / DISCOVERY CONFIGURATION
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# =======================================================
# CORE BACKEND VERBOSE DEBUG LOGGING
# =======================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.mygym.app=DEBUG

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}
mga.clients.people-crud-url=${PEOPLE_CRUD_URL:http://mga-people-crud-service.default.svc.cluster.local}
mga.clients.records-crud-url=${RECORDS_CRUD_URL:http://mga-records-crud-service.default.svc.cluster.local}
mga.clients.resource-crud-url=${RESOURCE_CRUD_URL:http://mga-resource-crud-service.default.svc.cluster.local}
mga.clients.retry.max-attempts=3
mga.clients.retry.backoff=200ms
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.bulkhead.configs.default.max-concurrent-calls=25
resilience4j.bulkhead.configs.default.max-wait-duration=100ms
